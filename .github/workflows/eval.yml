name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Regression tests
        run: python -m pytest tests -q

      - name: Layered evaluation
        run: python eval/evaluate_v2.py

      - name: Show headline metrics
        run: |
          echo "### 分层评测结果" >> $GITHUB_STEP_SUMMARY
          sed -n '/## 一、/,/## 二、/p' eval/report-v2.md >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval/report-v2.md
            eval/results-v2-*.csv
